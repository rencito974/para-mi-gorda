<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestra Historia 💕</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💕</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Cormorant+Garamond:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="timeline.css">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body>

    <div class="gradient-bg"></div>
    <div class="hearts-container" id="heartsContainer"></div>
    <div class="custom-cursor" id="customCursor"></div>

    <!-- ── Floating Music Player ──────────────────────── -->
    <div class="music-widget" id="musicWidget">
        <div class="vinyl-wrap" onclick="toggleMusic()" title="Reproducir / Pausar">
            <div class="vinyl" id="vinyl">
                <div class="vinyl-shine"></div>
            </div>
            <div class="play-overlay" id="playOverlay"><i data-lucide="play"></i></div>
        </div>
        <div class="music-meta">
            <p class="music-name">Stand By Me</p>
            <p class="music-artist">Ben E. King</p>
        </div>
        <div id="yt-player-container" style="position:absolute;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none;bottom:0;right:0;"></div>
    </div>

    <div class="wrapper">

        <!-- ── Header ───────────────────────────────────── -->
        <header class="site-header">
            <h1>Nuestra Historia</h1>
            <p class="site-subtitle">Cada momento que vivimos juntos</p>
        </header>

        <!-- ── Daily Message ────────────────────────────── -->
        <section class="daily-section">
            <div class="daily-card">
                <div class="daily-quote-mark">"</div>
                <p class="daily-message" id="dailyMessage">...</p>
                <div class="daily-footer">
                    <span class="daily-heart"><i data-lucide="heart"></i></span>
                    <span class="daily-date" id="dailyDate"></span>
                </div>
            </div>
        </section>

        <!-- ── Relationship Stats ───────────────────────── -->
        <section class="stats-section">
            <h2 class="section-title">Nuestros Números</h2>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon"><i data-lucide="calendar-days"></i></div>
                    <div class="stat-number" id="daysTogether">0</div>
                    <div class="stat-name">Días Juntos</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon"><i data-lucide="phone-call"></i></div>
                    <div class="stat-number" id="hoursTalking">0</div>
                    <div class="stat-name">Horas Hablando</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon"><i data-lucide="sparkles"></i></div>
                    <div class="stat-number" id="momentCount">0</div>
                    <div class="stat-name">Momentos Especiales</div>
                </div>
            </div>
        </section>

        <!-- ── Birthday Countdowns ───────────────────────── -->
        <section class="birthday-section">
            <h2 class="section-title">Próximos Cumpleaños</h2>
            <div class="birthday-grid">
                <div class="birthday-card">
                    <div class="birthday-icon">🎂</div>
                    <div class="birthday-label">Tu cumple</div>
                    <div class="birthday-days" id="herBirthdayDays">—</div>
                    <div class="birthday-sublabel">días · 24 de agosto</div>
                </div>
                <div class="birthday-card">
                    <div class="birthday-icon">🎂</div>
                    <div class="birthday-label">Mi cumple</div>
                    <div class="birthday-days" id="hisBirthdayDays">—</div>
                    <div class="birthday-sublabel">días · 27 de febrero</div>
                </div>
            </div>
        </section>

        <!-- ── Timeline ─────────────────────────────────── -->
        <section class="timeline-section">
            <h2 class="section-title">Línea de Tiempo</h2>

            <div class="timeline-wrap" id="timelineWrap">
                <div class="timeline-empty-state" id="emptyState">
                    <div class="empty-icon"><i data-lucide="heart"></i></div>
                    <p>Todavía no hay momentos.</p>
                </div>
            </div>
        </section>

    </div>

    <!-- ── Lightbox ─────────────────────────────────────── -->
    <div class="lightbox" id="lightbox" onclick="handleLightboxClick(event)">
        <button class="lb-close" onclick="closeLightbox()"><i data-lucide="x"></i></button>
        <button class="lb-nav lb-prev" id="lbPrev" onclick="lightboxNav(-1)"><i data-lucide="chevron-left"></i></button>
        <div class="lb-img-wrap" id="lbMediaWrap">
            <img class="lb-img" id="lbImg" src="" alt="">
            <video class="lb-video" id="lbVideo" controls playsinline></video>
        </div>
        <button class="lb-nav lb-next" id="lbNext" onclick="lightboxNav(1)"><i data-lucide="chevron-right"></i></button>
        <div class="lb-counter" id="lbCounter"></div>
    </div>

    <!-- ── Gallery overlay (4+ photos) ─────────────────── -->
    <div class="gallery-overlay" id="galleryOverlay" onclick="handleGalleryClick(event)">
        <div class="gallery-box">
            <button class="gallery-close" onclick="closeGallery()"><i data-lucide="x"></i></button>
            <h3 class="gallery-title" id="galleryTitle"></h3>
            <div class="gallery-grid" id="galleryGrid"></div>
        </div>
    </div>

    <script src="timeline.js"></script>
</body>
</html>
